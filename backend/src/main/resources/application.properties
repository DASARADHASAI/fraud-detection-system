# =============================================================================
# Spring Boot configuration.
#
# NOTE: the fraud THRESHOLDS are not here. They live in ../config.yaml, which
# the Python service reads too - see SharedConfig.java. Keeping them in one
# file is what stops Java and Python quietly disagreeing about what counts as
# fraud.
# =============================================================================

spring.application.name=fraud-detection-backend
server.port=8080

# --- Database -----------------------------------------------------------------
# H2 in FILE mode, so the data survives a restart and the demo keeps its
# history. To switch to MySQL later, change these five lines and the pom
# dependency; no Java code changes, because everything goes through Spring
# Data JPA.
spring.datasource.url=jdbc:h2:file:./data/frauddb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the tables at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/frauddb, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Logging ------------------------------------------------------------------
logging.level.com.klu.fraud=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# --- JSON ---------------------------------------------------------------------
# Write timestamps as readable ISO strings rather than epoch numbers, so the
# dashboard does not have to convert them.
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Error responses ----------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
